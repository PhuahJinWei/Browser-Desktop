<!--
  M7 gate — does a YouTube embed load and play inside <iframe credentialless> under this
  desktop's COOP/COEP? Kept because the spike could answer only half the question in an
  automated browser, and the other half is a thirty-second check in a real one.

  NOT part of the build. `docs/` is never copied into `dist/`, so this cannot ship. To run it:

      npm run build:pages
      cp docs/spikes/m7-credentialless-embed.html dist/
      npm run serve:pages -- --port 4210 --base /tabula/
      # open http://localhost:4210/tabula/ first, so the service worker registers and the
      # origin actually becomes cross-origin isolated, then open
      # http://localhost:4210/tabula/m7-credentialless-embed.html

  Expected on a real Chrome: crossOriginIsolated true; A (credentialless) loads AND
  currentTime climbs past 0; B (plain frame) stays silent, refused by COEP. B being refused
  is the point — it is what proves the attribute is doing the work rather than the frame
  simply being allowed anyway.

  The page carries its own CSP. The desktop's policy is untouched: `frame-src` here is what
  the app's policy would have to gain, and 'unsafe-inline' is for this harness only.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>M7 spike — credentialless YouTube embed under COOP/COEP</title>
    <!--
      This page carries its OWN policy. The desktop's CSP is untouched: the question the spike
      answers is whether the browser's isolation rules permit the frame at all, which is not
      something we control. frame-src here is what the app's policy would have to gain.
      'unsafe-inline' is for the spike's own reporting script and would not be needed by the app.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com"
    />
    <style>
      body {
        font:
          14px/1.5 system-ui,
          sans-serif;
        margin: 16px;
        background: #111;
        color: #eee;
      }
      h1 {
        font-size: 16px;
      }
      table {
        border-collapse: collapse;
        margin-bottom: 12px;
      }
      td {
        padding: 2px 10px 2px 0;
        vertical-align: top;
      }
      .k {
        color: #9cf;
      }
      .pass {
        color: #7f7;
        font-weight: 700;
      }
      .fail {
        color: #f77;
        font-weight: 700;
      }
      iframe {
        width: 420px;
        height: 236px;
        border: 1px solid #444;
        background: #000;
      }
      .frames {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }
      figcaption {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 4px;
      }
      #log {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #bbb;
        max-height: 180px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>M7 spike — does a YouTube embed load and play in a credentialless frame?</h1>
    <table>
      <tr>
        <td class="k">crossOriginIsolated</td>
        <td id="coi">…</td>
      </tr>
      <tr>
        <td class="k">credentialless supported</td>
        <td id="sup">…</td>
      </tr>
      <tr>
        <td class="k">A · credentialless — loaded</td>
        <td id="a-load">…</td>
      </tr>
      <tr>
        <td class="k">A · credentialless — PLAYING</td>
        <td id="a-play">…</td>
      </tr>
      <tr>
        <td class="k">B · control, no attribute</td>
        <td id="b-load">…</td>
      </tr>
      <tr>
        <td class="k">VERDICT</td>
        <td id="verdict">…</td>
      </tr>
    </table>

    <div class="frames">
      <figure>
        <figcaption>A — &lt;iframe credentialless&gt;</figcaption>
        <div id="slot-a"></div>
      </figure>
      <figure>
        <figcaption>B — control, plain &lt;iframe&gt; (expected to be blocked)</figcaption>
        <div id="slot-b"></div>
      </figure>
    </div>

    <div id="log"></div>

    <script>
      // Big Buck Bunny — Blender Foundation, CC-BY. Public, stable, embeddable.
      const VIDEO = 'aqz-KE-bpKQ';
      const ORIGIN = 'https://www.youtube-nocookie.com';
      const ISOLATED = self.crossOriginIsolated === true;
      const SUPPORTED = 'credentialless' in HTMLIFrameElement.prototype;
      const frames = {};
      const log = (m) => {
        const el = document.getElementById('log');
        el.textContent = (m + String.fromCharCode(10) + el.textContent).slice(0, 4000);
      };
      const set = (id, ok, text) => {
        const el = document.getElementById(id);
        el.textContent = text;
        el.className = ok === null ? '' : ok ? 'pass' : 'fail';
      };

      set('coi', ISOLATED, String(ISOLATED));
      set('sup', SUPPORTED, String(SUPPORTED));

      const src = (id) =>
        `${ORIGIN}/embed/${id}?enablejsapi=1&autoplay=1&mute=1&playsinline=1&origin=${encodeURIComponent(location.origin)}`;

      function mount(key, slot, credentialless) {
        const f = document.createElement('iframe');
        if (credentialless) f.setAttribute('credentialless', '');
        f.allow = 'autoplay; encrypted-media';
        f.src = src(VIDEO);
        const rec = { el: f, loaded: false, spoke: false, state: null, maxTime: 0 };
        frames[key] = rec;
        f.addEventListener('load', () => {
          rec.loaded = true;
          log(key + ': load');
          // Handshake, then ask it to play. Repeat a few times: the widget ignores commands sent
          // before it is ready, and there is no event that tells us when that is.
          let n = 0;
          const t = setInterval(() => {
            if (++n > 20) return clearInterval(t);
            f.contentWindow?.postMessage(
              JSON.stringify({ event: 'listening', id: key, channel: 'widget' }),
              ORIGIN,
            );
            f.contentWindow?.postMessage(
              JSON.stringify({
                event: 'command',
                func: 'playVideo',
                args: [],
                id: key,
                channel: 'widget',
              }),
              ORIGIN,
            );
          }, 500);
        });
        document.getElementById(slot).append(f);
        return rec;
      }

      // A always uses the attribute. B is the control: on an isolated page COEP should refuse it;
      // on a plain page it is an ordinary frame and shows what "working" looks like.
      mount('A', 'slot-a', true);
      mount('B', 'slot-b', false);

      window.addEventListener('message', (event) => {
        if (event.origin !== ORIGIN) return;
        let data = event.data;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch {
            return;
          }
        }
        const rec =
          event.source === frames.A.el.contentWindow
            ? frames.A
            : event.source === frames.B.el.contentWindow
              ? frames.B
              : null;
        if (!rec) return;
        const key = rec === frames.A ? 'A' : 'B';
        rec.spoke = true;
        const info = data && data.info;
        if (info && typeof info === 'object') {
          if (typeof info.playerState === 'number') rec.state = info.playerState;
          if (typeof info.currentTime === 'number' && info.currentTime > rec.maxTime) {
            rec.maxTime = info.currentTime;
          }
        }
        if (typeof info === 'number') rec.state = info;
        if (data.event && data.event !== 'infoDelivery') log(key + ': ' + data.event);
        render();
      });

      function render() {
        const a = frames.A,
          b = frames.B;
        set('a-load', a.loaded, a.loaded ? 'load event fired' : 'no load');
        // Progress past zero is the only proof that matters: state can say PLAYING while stalled.
        set(
          'a-play',
          a.maxTime > 0,
          a.maxTime > 0
            ? `PLAYING — currentTime reached ${a.maxTime.toFixed(1)}s`
            : `state ${a.state ?? '—'}, currentTime 0`,
        );
        if (ISOLATED) {
          set(
            'b-load',
            !b.spoke,
            b.spoke ? 'responded — NOT blocked' : 'silent — blocked by COEP, as expected',
          );
        } else {
          set(
            'b-load',
            b.maxTime > 0,
            b.maxTime > 0
              ? `plain frame plays — ${b.maxTime.toFixed(1)}s (baseline)`
              : 'plain frame: currentTime 0',
          );
        }
        const pass = ISOLATED && SUPPORTED && a.loaded && a.maxTime > 0 && !b.spoke;
        const baseline = !ISOLATED && b.maxTime > 0;
        set(
          'verdict',
          pass || baseline ? true : null,
          ISOLATED
            ? pass
              ? 'PASS — isolated, credentialless frame plays; plain frame refused'
              : 'waiting…'
            : baseline
              ? 'BASELINE — not isolated; this is what working looks like'
              : 'waiting…',
        );
        window.__spike = {
          isolated: ISOLATED,
          supported: SUPPORTED,
          a: { loaded: a.loaded, state: a.state, maxTime: a.maxTime, spoke: a.spoke },
          b: { loaded: b.loaded, state: b.state, maxTime: b.maxTime, spoke: b.spoke },
        };
      }
      setInterval(render, 500);
      render();
    </script>
  </body>
</html>
